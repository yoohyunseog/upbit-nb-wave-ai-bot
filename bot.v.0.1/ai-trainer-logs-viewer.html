<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 트레이너 로그 뷰어</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .container-fluid {
            padding: 20px;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .log-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 20px;
            height: 70vh;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .log-entry {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            border-left: 4px solid #00ff88;
            transition: all 0.3s ease;
        }

        .log-entry:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .log-time {
            color: #00ff88;
            font-weight: bold;
            font-size: 0.9em;
        }

        .log-message {
            color: #ffffff;
            margin-top: 5px;
            line-height: 1.4;
        }

        .log-entry.error {
            border-left-color: #ff0088;
        }

        .log-entry.error .log-time {
            color: #ff0088;
        }

        .log-entry.warning {
            border-left-color: #ffaa00;
        }

        .log-entry.warning .log-time {
            color: #ffaa00;
        }

        .log-entry.info {
            border-left-color: #0088ff;
        }

        .log-entry.info .log-time {
            color: #0088ff;
        }

        .controls {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-custom {
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            padding: 10px 20px;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        .btn-danger-custom {
            background: linear-gradient(45deg, #ff0088, #cc006a);
            color: #fff;
        }

        .btn-danger-custom:hover {
            box-shadow: 0 5px 15px rgba(255, 0, 136, 0.3);
        }

        .stats {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item {
            display: inline-block;
            margin: 0 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #00ff88;
        }

        .stat-label {
            font-size: 0.9em;
            color: #cccccc;
        }

        .search-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            padding: 10px 15px;
            width: 300px;
        }

        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .filter-buttons {
            margin: 10px 0;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 20px;
            padding: 5px 15px;
            margin: 2px;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: #00ff88;
            color: #000;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #00ff88;
        }

        .scroll-to-bottom {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .scroll-to-bottom:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        /* 스크롤바 스타일링 */
        .log-container::-webkit-scrollbar {
            width: 8px;
        }

        .log-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .log-container::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 4px;
        }

        .log-container::-webkit-scrollbar-thumb:hover {
            background: #00cc6a;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- 헤더 -->
        <div class="header">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1><i class="fas fa-robot"></i> AI 트레이너 로그 뷰어</h1>
                    <p class="mb-0">실시간 AI 트레이너 활동 모니터링</p>
                </div>
                <div class="col-md-4 text-end">
                    <div class="stat-item">
                        <div class="stat-value" id="totalLogs">0</div>
                        <div class="stat-label">총 로그</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="lastUpdate">--:--</div>
                        <div class="stat-label">마지막 업데이트</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 컨트롤 패널 -->
        <div class="controls">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <input type="text" class="search-box" id="searchBox" placeholder="로그 검색...">
                </div>
                <div class="col-md-4">
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">전체</button>
                        <button class="filter-btn" data-filter="error">오류</button>
                        <button class="filter-btn" data-filter="warning">경고</button>
                        <button class="filter-btn" data-filter="info">정보</button>
                        <button class="filter-btn" data-filter="success">성공</button>
                    </div>
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn btn-custom" id="refreshBtn">
                        <i class="fas fa-sync-alt"></i> 새로고침
                    </button>
                    <button class="btn btn-danger-custom" id="clearBtn">
                        <i class="fas fa-trash"></i> 로그 지우기
                    </button>
                    <button class="btn btn-custom" id="autoScrollBtn">
                        <i class="fas fa-arrow-down"></i> 자동 스크롤
                    </button>
                </div>
            </div>
        </div>

        <!-- 통계 -->
        <div class="stats">
            <div class="row text-center">
                <div class="col-md-3">
                    <div class="stat-item">
                        <div class="stat-value" id="errorCount">0</div>
                        <div class="stat-label">오류</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-item">
                        <div class="stat-value" id="warningCount">0</div>
                        <div class="stat-label">경고</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-item">
                        <div class="stat-value" id="infoCount">0</div>
                        <div class="stat-label">정보</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-item">
                        <div class="stat-value" id="successCount">0</div>
                        <div class="stat-label">성공</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 로그 컨테이너 -->
        <div class="log-container" id="logContainer">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i> 로그를 불러오는 중...
            </div>
        </div>

        <!-- 스크롤 버튼 -->
        <button class="scroll-to-bottom" id="scrollToBottom" style="display: none;">
            <i class="fas fa-arrow-down"></i>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        class AITrainerLogViewer {
            constructor() {
                this.logs = [];
                this.filteredLogs = [];
                this.currentFilter = 'all';
                this.autoScroll = true;
                this.isLoading = false;
                
                this.initElements();
                this.bindEvents();
                this.loadLogs();
                this.startAutoRefresh();
            }

            initElements() {
                this.logContainer = document.getElementById('logContainer');
                this.searchBox = document.getElementById('searchBox');
                this.refreshBtn = document.getElementById('refreshBtn');
                this.clearBtn = document.getElementById('clearBtn');
                this.autoScrollBtn = document.getElementById('autoScrollBtn');
                this.scrollToBottomBtn = document.getElementById('scrollToBottom');
                
                // 통계 요소들
                this.totalLogsEl = document.getElementById('totalLogs');
                this.lastUpdateEl = document.getElementById('lastUpdate');
                this.errorCountEl = document.getElementById('errorCount');
                this.warningCountEl = document.getElementById('warningCount');
                this.infoCountEl = document.getElementById('infoCount');
                this.successCountEl = document.getElementById('successCount');
            }

            bindEvents() {
                this.refreshBtn.addEventListener('click', () => this.loadLogs());
                this.clearBtn.addEventListener('click', () => this.clearLogs());
                this.autoScrollBtn.addEventListener('click', () => this.toggleAutoScroll());
                this.scrollToBottomBtn.addEventListener('click', () => this.scrollToBottom());
                
                this.searchBox.addEventListener('input', (e) => this.filterLogs());
                
                // 필터 버튼들
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentFilter = e.target.dataset.filter;
                        this.filterLogs();
                    });
                });

                // 스크롤 이벤트
                this.logContainer.addEventListener('scroll', () => {
                    const isAtBottom = this.logContainer.scrollTop + this.logContainer.clientHeight >= this.logContainer.scrollHeight - 10;
                    this.autoScroll = isAtBottom;
                    this.scrollToBottomBtn.style.display = isAtBottom ? 'none' : 'block';
                });
            }

                         async loadLogs() {
                 if (this.isLoading) return;
                 
                 this.isLoading = true;
                 this.showLoading();
 
                 try {
                     const response = await fetch('log/ai-trainer-logs-2025-08-23.txt');
                     if (!response.ok) throw new Error('로그 파일을 불러올 수 없습니다.');
                     
                     const text = await response.text();
                     this.parseLogs(text);
                     this.updateStats();
                     this.renderLogs();
                     this.updateLastUpdate();
                 } catch (error) {
                     console.error('로그 로딩 오류:', error);
                     this.showError('로그 파일을 불러올 수 없습니다: ' + error.message);
                 } finally {
                     this.isLoading = false;
                 }
             }

            parseLogs(text) {
                this.logs = [];
                const lines = text.split('\n');
                
                lines.forEach(line => {
                    if (!line.trim()) return;
                    
                    const logEntry = this.parseLogLine(line);
                    if (logEntry) {
                        this.logs.push(logEntry);
                    }
                });
            }

            parseLogLine(line) {
                // [오후 11:36:56] 🎯 트레이너 목표 지점 도착! 구역 작업 시작...
                const timeMatch = line.match(/\[([^\]]+)\]\s*(.+)/);
                if (!timeMatch) return null;

                const time = timeMatch[1];
                const message = timeMatch[2];
                
                // 로그 타입 분류
                let type = 'info';
                if (message.includes('❌') || message.includes('오류') || message.includes('실패')) {
                    type = 'error';
                } else if (message.includes('⚠️') || message.includes('경고')) {
                    type = 'warning';
                } else if (message.includes('✅') || message.includes('성공') || message.includes('완료')) {
                    type = 'success';
                } else if (message.includes('🎯') || message.includes('목표')) {
                    type = 'info';
                }

                return {
                    time,
                    message,
                    type,
                    original: line
                };
            }

            filterLogs() {
                const searchTerm = this.searchBox.value.toLowerCase();
                
                this.filteredLogs = this.logs.filter(log => {
                    const matchesFilter = this.currentFilter === 'all' || log.type === this.currentFilter;
                    const matchesSearch = log.message.toLowerCase().includes(searchTerm) || 
                                        log.time.toLowerCase().includes(searchTerm);
                    
                    return matchesFilter && matchesSearch;
                });
            }

            renderLogs() {
                this.filterLogs();
                
                if (this.filteredLogs.length === 0) {
                    this.logContainer.innerHTML = '<div class="text-center p-4">표시할 로그가 없습니다.</div>';
                    return;
                }

                const logHTML = this.filteredLogs.map(log => `
                    <div class="log-entry ${log.type}">
                        <div class="log-time">${log.time}</div>
                        <div class="log-message">${this.escapeHtml(log.message)}</div>
                    </div>
                `).join('');

                this.logContainer.innerHTML = logHTML;
                
                if (this.autoScroll) {
                    this.scrollToBottom();
                }
            }

            updateStats() {
                const stats = {
                    total: this.logs.length,
                    error: this.logs.filter(log => log.type === 'error').length,
                    warning: this.logs.filter(log => log.type === 'warning').length,
                    info: this.logs.filter(log => log.type === 'info').length,
                    success: this.logs.filter(log => log.type === 'success').length
                };

                this.totalLogsEl.textContent = stats.total;
                this.errorCountEl.textContent = stats.error;
                this.warningCountEl.textContent = stats.warning;
                this.infoCountEl.textContent = stats.info;
                this.successCountEl.textContent = stats.success;
            }

            updateLastUpdate() {
                const now = new Date();
                this.lastUpdateEl.textContent = now.toLocaleTimeString('ko-KR');
            }

            clearLogs() {
                if (confirm('모든 로그를 지우시겠습니까?')) {
                    this.logs = [];
                    this.filteredLogs = [];
                    this.updateStats();
                    this.renderLogs();
                }
            }

            toggleAutoScroll() {
                this.autoScroll = !this.autoScroll;
                this.autoScrollBtn.innerHTML = this.autoScroll ? 
                    '<i class="fas fa-arrow-down"></i> 자동 스크롤' : 
                    '<i class="fas fa-pause"></i> 자동 스크롤';
                
                if (this.autoScroll) {
                    this.scrollToBottom();
                }
            }

            scrollToBottom() {
                this.logContainer.scrollTop = this.logContainer.scrollHeight;
            }

            showLoading() {
                this.logContainer.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i> 로그를 불러오는 중...
                    </div>
                `;
            }

            showError(message) {
                this.logContainer.innerHTML = `
                    <div class="text-center p-4 text-danger">
                        <i class="fas fa-exclamation-triangle"></i> ${message}
                    </div>
                `;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            startAutoRefresh() {
                // 30초마다 자동 새로고침
                setInterval(() => {
                    if (!this.isLoading) {
                        this.loadLogs();
                    }
                }, 30000);
            }
        }

        // 페이지 로드 시 뷰어 초기화
        document.addEventListener('DOMContentLoaded', () => {
            new AITrainerLogViewer();
        });
    </script>
</body>
</html>
