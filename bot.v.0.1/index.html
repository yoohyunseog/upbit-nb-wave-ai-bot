<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8BIT Trading System - Starcraft Style</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
    <div class="game-container">
        <!-- Game Header -->
        <div class="game-header">
            <div class="mineral-counter">
                <i class="fas fa-coins"></i>
                <span id="mineral-count">1000</span>
            </div>
            <div class="gas-counter">
                <i class="fas fa-fire"></i>
                <span id="gas-count">500</span>
            </div>
            <div class="supply-counter">
                <i class="fas fa-users"></i>
                <span id="supply-count">8/10</span>
            </div>
        </div>

        <!-- Main Game Area -->
        <div class="game-main">
            <!-- Left Panel - Menu -->
            <div class="left-panel">
                <div class="menu-container">
                    <h2 class="menu-title">Command Center</h2>
                    <div class="menu-buttons">
                        <button class="menu-btn primary-btn" onclick="loadModule('trading')">
                            <i class="fas fa-chart-line"></i>
                            <span>Trading Dashboard</span>
                        </button>
                        <button class="menu-btn secondary-btn" onclick="loadModule('guild')">
                            <i class="fas fa-users-cog"></i>
                            <span>Guild System</span>
                        </button>
                    </div>
                    <div class="screenshot-controls">
                        <h3>Screenshot Tools</h3>
                        <button class="screenshot-btn" onclick="takeScreenshot()" title="Take Screenshot (S)">
                            <i class="fas fa-camera"></i>
                            <span>Copy to Clipboard</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Center Panel - Content -->
            <div class="center-panel">
                <div id="content-area" class="content-area">
                    <div class="welcome-screen">
                        <div class="welcome-logo">
                            <i class="fas fa-robot"></i>
                        </div>
                        <h1>8BIT Trading System</h1>
                        <p>Select a module from the Command Center to begin</p>
                        <div class="status-indicators">
                            <div class="status-item">
                                <i class="fas fa-signal"></i>
                                <span>System Online</span>
                            </div>
                            <div class="status-item">
                                <i class="fas fa-database"></i>
                                <span>Database Connected</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Info -->
            <div class="right-panel">
                <div class="info-panel">
                    <h3>System Status</h3>
                    <div class="status-grid">
                        <div class="status-card">
                            <i class="fas fa-server"></i>
                            <span>Server: Online</span>
                        </div>
                        <div class="status-card">
                            <i class="fas fa-wifi"></i>
                            <span>Connection: Stable</span>
                        </div>
                        <div class="status-card">
                            <i class="fas fa-clock"></i>
                            <span id="current-time">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Footer -->
        <div class="game-footer">
            <div class="footer-left">
                <span>8BIT Trading System v0.1</span>
            </div>
            <div class="footer-center">
                <div class="log-container">
                    <span id="status-message">Ready</span>
                    <span class="cursor">|</span>
                </div>
            </div>
            <!-- 사운드 설정 패널 -->
            <div class="sound-settings-panel" id="sound-settings-panel">
                <div class="settings-header">
                    <h3>🎵 Sound Settings</h3>
                    <button class="close-btn" onclick="toggleSoundSettings()">×</button>
                </div>
                <div class="settings-content">
                    <div class="setting-group">
                        <label>Master Volume:</label>
                        <input type="range" id="master-volume" min="0" max="100" value="50" onchange="updateMasterVolume()">
                        <span id="master-volume-value">50%</span>
                    </div>
                    
                    <div class="setting-group">
                        <label>Click Sound Volume:</label>
                        <input type="range" id="click-volume" min="0" max="100" value="40" onchange="updateClickVolume()">
                        <span id="click-volume-value">40%</span>
                    </div>
                    
                    <div class="setting-group">
                        <label>Success Sound Volume:</label>
                        <input type="range" id="success-volume" min="0" max="100" value="30" onchange="updateSuccessVolume()">
                        <span id="success-volume-value">30%</span>
                    </div>
                    
                    <div class="setting-group">
                        <label>Error Sound Volume:</label>
                        <input type="range" id="error-volume" min="0" max="100" value="30" onchange="updateErrorVolume()">
                        <span id="error-volume-value">30%</span>
                    </div>
                    
                    <div class="setting-group">
                        <label>Type Sound Volume:</label>
                        <input type="range" id="type-volume" min="0" max="100" value="20" onchange="updateTypeVolume()">
                        <span id="type-volume-value">20%</span>
                    </div>
                    
                    <div class="setting-group">
                        <label>Sequence Volume:</label>
                        <input type="range" id="sequence-volume" min="0" max="100" value="15" onchange="updateSequenceVolume()">
                        <span id="sequence-volume-value">15%</span>
                    </div>
                    
                    <div class="setting-group">
                        <label>Sound Effects:</label>
                        <div class="checkbox-group">
                            <input type="checkbox" id="enable-click" checked onchange="toggleSoundEffect('click')">
                            <label for="enable-click">Click Sounds</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="enable-success" checked onchange="toggleSoundEffect('success')">
                            <label for="enable-success">Success Sounds</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="enable-error" checked onchange="toggleSoundEffect('error')">
                            <label for="enable-error">Error Sounds</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="enable-type" checked onchange="toggleSoundEffect('type')">
                            <label for="enable-type">Type Sounds</label>
                        </div>
                    </div>
                    
                    <div class="setting-buttons">
                        <button class="test-btn" onclick="testAllSounds()">Test All Sounds</button>
                        <button class="reset-btn" onclick="resetSoundSettings()">Reset to Default</button>
                    </div>
                </div>
            </div>

            <!-- 사운드 설정 버튼 -->
            <div class="footer-right">
                <button class="sound-settings-btn" onclick="toggleSoundSettings()">
                    <i class="fas fa-cog"></i>
                </button>
                <button class="sound-toggle" onclick="toggleSound()">
                    <i class="fas fa-volume-up" id="sound-icon"></i>
                </button>
                <div class="sound-status" id="sound-status">
                    <i class="fas fa-pause" id="sound-status-icon"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio System -->
    <script src="audio/audio-system.js"></script>

    <script src="app.js"></script>
</body>
</html>
