<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Left Panel Log Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --bg-panel: #0b1a33;
      --bg-panel-2: #0e2244;
      --line: #1e3a8a;
      --line-2: #0ea5e9;
      --text: #e5e7eb;
      --text-dim: #94a3b8;
      --accent: #22d3ee;
      --accent-2: #60a5fa;
      --warn: #f59e0b;
      --ok: #34d399;
      --err: #ef4444;
    }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Segoe UI, Roboto, Arial, "Noto Sans KR", system-ui, sans-serif; }
    /* StarCraft-like panels */
    .sc-panel {
      background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
      border: 1px solid var(--line);
      box-shadow: inset 0 0 0 1px rgba(14,165,233,0.15), 0 0 20px rgba(14,165,233,0.08);
      border-radius: 6px;
    }
    header {
      position: sticky; top: 0; z-index: 10; padding: 10px 12px; margin: 10px; border-radius: 8px;
      background: linear-gradient(180deg, #0b1730 0%, #0a1530 100%);
      border: 1px solid var(--line);
      box-shadow: inset 0 0 0 1px rgba(96,165,250,0.15), 0 0 24px rgba(34,211,238,0.12);
    }
    header .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header label { font-size: 12px; color: var(--text-dim); }
    header input, header select, header button {
      height: 32px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
      background: #071427; color: var(--text);
      box-shadow: inset 0 0 0 1px rgba(34,211,238,0.1);
    }
    header button { cursor: pointer; background: linear-gradient(180deg, #0a3b6a, #082f55); border-color: var(--line-2); }
    header button:hover { filter: brightness(1.08); }
    header select { background-image: linear-gradient(180deg, #0b1f3f, #0a1a33); }
    .spacer { flex: 1; }

    main { padding: 0 10px 10px; }
    .layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; }
    .pane { min-height: calc(100vh - 140px); }
    .table-wrap { overflow: auto; height: 100%; }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      position: sticky; top: 0;
      background: #0b1730; color: var(--text-dim);
      font-weight: 700; font-size: 12px; text-align: left; padding: 8px;
      border-bottom: 1px solid var(--line);
    }
    tbody tr { border-bottom: 1px dashed rgba(14,165,233,0.25); cursor: pointer; }
    tbody tr:hover { background: rgba(14,165,233,0.06); }
    tbody tr.active { background: rgba(34,211,238,0.09); }
    tbody td { font-size: 13px; padding: 8px; vertical-align: top; color: var(--text); }

    .muted { color: var(--text-dim); font-size: 12px; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; border: 1px solid var(--line-2); background: rgba(14,165,233,0.08); color: #bfe7ff; }
    .row-compact td { padding-top: 6px; padding-bottom: 6px; }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .err { color: var(--err); }
    .right { text-align: right; }
    .nowrap { white-space: nowrap; }
    .monospace { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }

    .detail-pane { padding: 10px; }
    .detail-header { display:flex; align-items:center; justify-content:space-between; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    .tree { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 12px; line-height: 1.4; padding: 10px; }
    .tree .k { color: #93c5fd; }
    .tree .v { color: #e5e7eb; }
    .tree .num { color: #fcd34d; }
    .tree .bool { color: #34d399; }
    .tree .null { color: #9ca3af; font-style: italic; }
    .tree details { margin-left: 12px; }
    .tree summary { cursor: pointer; }

         .footer { color: var(--text-dim); font-size: 12px; padding: 8px 16px 16px; }
     
     /* 카드 뷰 스타일 */
     .card-view { display: none; }
     .card-view.active { display: block; }
     .table-wrap { display: block; }
     .table-wrap.active { display: block; }
     .card-grid {
       display: grid;
       grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
       gap: 12px;
       padding: 10px;
     }
     .timeframe-card {
       background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
       border: 1px solid var(--line);
       border-radius: 8px;
       padding: 12px;
       box-shadow: inset 0 0 0 1px rgba(14,165,233,0.15), 0 0 20px rgba(14,165,233,0.08);
     }
     .card-header {
       display: flex;
       justify-content: space-between;
       align-items: center;
       margin-bottom: 8px;
       padding-bottom: 8px;
       border-bottom: 1px solid var(--line);
     }
     .card-title {
       font-weight: bold;
       font-size: 16px;
       color: var(--accent);
     }
     .card-status {
       display: flex;
       gap: 4px;
     }
     .status-badge {
       padding: 2px 6px;
       border-radius: 4px;
       font-size: 10px;
       font-weight: bold;
     }
     .status-active { background: var(--ok); color: #000; }
     .status-selected { background: var(--accent); color: #000; }
     .status-can-sell { background: var(--warn); color: #000; }
     
     .card-content {
       font-size: 12px;
       line-height: 1.4;
     }
     .card-row {
       display: flex;
       justify-content: space-between;
       margin-bottom: 4px;
       padding: 2px 0;
     }
     .card-label {
       color: var(--text-dim);
       font-weight: 500;
     }
     .card-value {
       color: var(--text);
       font-weight: bold;
     }
     .card-value.positive { color: var(--ok); }
     .card-value.negative { color: var(--err); }
     .card-value.neutral { color: var(--accent-2); }
     
     .zone-badge {
       padding: 2px 8px;
       border-radius: 4px;
       font-size: 11px;
       font-weight: bold;
       text-align: center;
     }
     .zone-blue { background: #3b82f6; color: white; }
     .zone-orange { background: #f59e0b; color: white; }
     
     .view-toggle {
       display: flex;
       gap: 8px;
       margin-bottom: 10px;
     }
     .view-btn {
       padding: 6px 12px;
       border: 1px solid var(--line);
       background: var(--bg-panel);
       color: var(--text);
       border-radius: 4px;
       cursor: pointer;
       font-size: 12px;
     }
     .view-btn.active {
       background: var(--accent);
       color: #000;
       border-color: var(--accent);
     }
     
     @media (max-width: 1100px) {
       .layout { grid-template-columns: 1fr; }
       .card-grid { grid-template-columns: 1fr; }
     }
  </style>
  <script>
    (function(){
      const $ = (sel, root=document) => root.querySelector(sel);
      const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
      const endpointMap = {
        snapshot: (window.LEFT_PANEL_SNAPSHOT_ENDPOINT
          || (location.origin + '/api/leftpanel/snapshot')), // 최신 스냅샷 로그 API
        status: (window.LEFT_PANEL_LOG_ENDPOINT
          || (location.origin + '/api/leftpanel/log')), // 상태 로그 API
        comprehensive: (window.LEFT_PANEL_SNAPSHOT_ENDPOINT
          || (location.origin + '/api/leftpanel/snapshot')) // 포괄 로그 API (스냅샷과 동일)
      };

      let timer = null;

      function fmtTs(ts){
        try{
          if (typeof ts === 'string') ts = Number(ts);
          if (!ts || !isFinite(ts)) return '';
          // 허용: ms 또는 s
          if (ts < 2e10) ts = ts * 1000;
          const d = new Date(ts);
          const pad = (n)=> String(n).padStart(2,'0');
          return [
            d.getFullYear(), '-', pad(d.getMonth()+1), '-', pad(d.getDate()), ' ',
            pad(d.getHours()), ':', pad(d.getMinutes()), ':', pad(d.getSeconds())
          ].join('');
        }catch(_){ return ''; }
      }

      function safeParse(line){
        if (line == null) return null;
        if (typeof line === 'object') return line;
        try { return JSON.parse(String(line)); } catch(_){ return { raw: String(line) }; }
      }

      function getColumn(obj, path){
        try{
          return path.split('.').reduce((v, k)=> (v && k in v ? v[k] : undefined), obj);
        }catch(_){ return undefined; }
      }

             let lastLinesCache = [];
       let currentView = 'table'; // 'table' 또는 'card'

               function renderRows(lines){
        console.log('🎨 renderRows 시작:', lines.length, '개 항목');
        lastLinesCache = lines;
        const tbody = $('#log-body');
        tbody.innerHTML = '';
        
        // 데이터가 없을 때 기본 메시지 표시
        if (!lines || lines.length === 0) {
          console.log('⚠️ 데이터가 없어서 빈 메시지 표시');
          const emptyRow = document.createElement('tr');
          emptyRow.innerHTML = `
            <td colspan="11" style="text-align: center; padding: 40px; color: var(--text-dim);">
              <div style="font-size: 16px; margin-bottom: 8px;">📊 데이터가 없습니다</div>
              <div style="font-size: 12px;">
                서버가 실행 중인지 확인하고, 좌측 패널에서 데이터가 생성되었는지 확인해주세요.<br>
                <button onclick="load()" style="margin-top: 8px; padding: 4px 8px; background: var(--accent); color: #000; border: none; border-radius: 4px; cursor: pointer;">새로고침</button>
              </div>
            </td>
          `;
          tbody.appendChild(emptyRow);
          $('#resultCount').textContent = '0건';
          return;
        }
        
        const tfFilter = $('#tfFilter').value || '';
        const textFilter = ($('#textFilter').value || '').toLowerCase();
        const latestOnly = $('#latestOnly').checked;

        // 최신 분봉만 표시하는 경우 중복 제거
        let processedLines = lines;
        if (latestOnly) {
          const tfMap = new Map(); // 타임프레임별 최신 데이터 저장
          
          for (const line of lines) {
            const obj = safeParse(line);
            if (!obj) continue;
            
            const currentTf = obj.currentTimeframe || obj.tf || getColumn(obj,'selected.tf');
            if (!currentTf) continue;
            
            const ts = obj.ts || obj.time || obj.timestamp;
            if (!ts) continue;
            
            // 이미 있는 타임프레임보다 최신이면 업데이트
            if (!tfMap.has(currentTf) || ts > tfMap.get(currentTf).ts) {
              tfMap.set(currentTf, { ...obj, ts: ts });
            }
          }
          
          // Map에서 값만 추출하여 배열로 변환
          processedLines = Array.from(tfMap.values());
          
          // 타임스탬프 기준으로 정렬 (최신순)
          processedLines.sort((a, b) => (b.ts || b.time || b.timestamp) - (a.ts || a.time || a.timestamp));
        }

        const rows = [];
        console.log('🔍 처리된 라인 수:', processedLines.length);
        
        for (let i = 0; i < processedLines.length; i++) {
          const obj = processedLines[i];
          console.log(`📋 항목 ${i + 1}/${processedLines.length}:`, obj);
          
          // 스냅샷 형태 기준으로 컬럼 추출 (status 로그는 raw로만 표시될 수 있음)
          const ts = obj.ts || obj.time || obj.timestamp;
          const currentTf = obj.currentTimeframe || obj.tf || getColumn(obj,'selected.tf');
          const selectedTf = getColumn(obj,'selected.tf');
          const zone = getColumn(obj,'market.zone');
          const strength = getColumn(obj,'market.zoneStrength');
          const price = getColumn(obj,'market.currentPrice');
          const nextAction = getColumn(obj,'trade.nextAction');
          const mode = getColumn(obj,'trade.mode');
          const has = getColumn(obj,'trade.hasActiveTrade');
          const expected = getColumn(obj,'expected.expectedReturnPct');
          
          // Comprehensive 데이터 추가 추출
          const systemStatus = getColumn(obj,'data.systemData.systemStatus');
          const memoryUsage = getColumn(obj,'data.systemData.memoryUsage');
          const marketData = getColumn(obj,'data.marketData');
          const tradeData = getColumn(obj,'data.tradeData');

          const tfForFilter = currentTf || selectedTf || '';
          if (tfFilter && tfFilter !== 'ALL' && tfForFilter && tfForFilter !== tfFilter) {
            console.log(`⏭️ 타임프레임 필터로 제외: ${tfForFilter} !== ${tfFilter}`);
            continue;
          }

          const serialized = JSON.stringify(obj).toLowerCase();
          if (textFilter && !serialized.includes(textFilter)) {
            console.log(`⏭️ 텍스트 필터로 제외`);
            continue;
          }
          
          // Comprehensive 데이터 특별 필터링
          const source = $('#source').value;
          if (source === 'comprehensive') {
            // comprehensive 타입의 데이터만 표시
            if (!obj.data || !obj.type || obj.type !== 'comprehensive') {
              console.log(`⏭️ comprehensive 필터로 제외: type=${obj.type}`);
              continue;
            }
          }
          
          // 데이터 타입 필터링
          const dataTypeFilter = $('#dataTypeFilter').value;
          if (dataTypeFilter !== 'ALL') {
            const objType = obj.type || 'unknown';
            if (objType !== dataTypeFilter) {
              console.log(`⏭️ 데이터 타입 필터로 제외: ${objType} !== ${dataTypeFilter}`);
              continue;
            }
          }

          console.log(`✅ 행 생성: TF=${currentTf}, 시간=${fmtTs(ts)}`);
          
          const tr = document.createElement('tr');
          tr.className = 'row-compact';
          tr.innerHTML = `
            <td class="nowrap monospace">${fmtTs(ts)}</td>
            <td class="nowrap">${currentTf || ''}</td>
            <td class="nowrap">${selectedTf || ''}</td>
            <td>${zone ? `<span class=\"badge\">${zone}</span>` : ''}</td>
            <td class="right">${(strength ?? '')}</td>
            <td class="right">${(price ?? '')}</td>
            <td class="nowrap">${mode ? `<span class=\"badge\">${mode}</span>` : ''}</td>
            <td class="nowrap">${nextAction || ''}</td>
            <td class="right">${(expected ?? '')}</td>
            <td class="nowrap">${systemStatus ? `<span class=\"badge ${systemStatus === 'running' ? 'ok' : 'warn'}\">${systemStatus}</span>` : ''}</td>
            <td class="right">${memoryUsage ? `${Math.round(memoryUsage.used / 1024 / 1024)}MB` : ''}</td>
          `;
          const btn = tr.querySelector('button[data-copy]');
          if (btn){
            btn.addEventListener('click', ()=>{
              navigator.clipboard.writeText(JSON.stringify(obj, null, 2)).catch(()=>{});
              btn.textContent = '복사됨';
              setTimeout(()=> btn.textContent = '복사', 1200);
            });
          }
          tr.addEventListener('click', ()=>{
            $$('#log-body tr').forEach(r=> r.classList.remove('active'));
            tr.classList.add('active');
            renderDetail(obj);
          });
                    rows.push(tr);
        }
        
        console.log(`📊 총 ${rows.length}개 행 생성 완료`);
        tbody.append(...rows);
        $('#resultCount').textContent = rows.length + '건';
         
         // 카드 뷰도 함께 렌더링
         if (currentView === 'card') {
           renderCards(lines);
         }
       }

       function renderCards(lines) {
         const cardGrid = $('#card-grid');
         cardGrid.innerHTML = '';
         
         const tfFilter = $('#tfFilter').value || '';
         const textFilter = ($('#textFilter').value || '').toLowerCase();
         const latestOnly = $('#latestOnly').checked;
         const source = $('#source').value;
         const dataTypeFilter = $('#dataTypeFilter').value;

         // 최신 분봉만 표시하는 경우 중복 제거
         let processedLines = lines;
         if (latestOnly) {
           const tfMap = new Map();
           
           for (const line of lines) {
             const obj = safeParse(line);
             if (!obj) continue;
             
             const currentTf = obj.currentTimeframe || obj.tf || getColumn(obj,'selected.tf');
             if (!currentTf) continue;
             
             const ts = obj.ts || obj.time || obj.timestamp;
             if (!ts) continue;
             
             if (!tfMap.has(currentTf) || ts > tfMap.get(currentTf).ts) {
               tfMap.set(currentTf, { ...obj, ts: ts });
             }
           }
           
           processedLines = Array.from(tfMap.values());
           processedLines.sort((a, b) => (b.ts || b.time || b.timestamp) - (a.ts || a.time || a.timestamp));
         }

         for (const obj of processedLines) {
           // 필터링 로직 (테이블과 동일)
           const currentTf = obj.currentTimeframe || obj.tf || getColumn(obj,'selected.tf');
           const tfForFilter = currentTf || '';
           if (tfFilter && tfFilter !== 'ALL' && tfForFilter && tfForFilter !== tfFilter) continue;

           const serialized = JSON.stringify(obj).toLowerCase();
           if (textFilter && !serialized.includes(textFilter)) continue;
           
           if (source === 'comprehensive') {
             if (!obj.data || !obj.type || obj.type !== 'comprehensive') continue;
           }
           
           if (dataTypeFilter !== 'ALL') {
             const objType = obj.type || 'unknown';
             if (objType !== dataTypeFilter) continue;
           }

           // 카드 생성
           const card = createTimeframeCard(obj);
           cardGrid.appendChild(card);
         }
       }

       function createTimeframeCard(obj) {
         const card = document.createElement('div');
         card.className = 'timeframe-card';
         
         // 타임프레임별 데이터 추출
         const timeframes = obj.data?.allTimeframes || {};
         const currentTf = obj.currentTimeframe || obj.tf || getColumn(obj,'selected.tf');
         
         if (currentTf && timeframes[currentTf]) {
           const tfData = timeframes[currentTf];
           card.innerHTML = createCardContent(currentTf, tfData, obj);
         } else {
           // 기존 데이터 구조 지원
           card.innerHTML = createLegacyCardContent(obj);
         }
         
         // 클릭 이벤트
         card.addEventListener('click', () => {
           document.querySelectorAll('.timeframe-card').forEach(c => c.style.border = '1px solid var(--line)');
           card.style.border = '2px solid var(--accent)';
           renderDetail(obj);
         });
         
         return card;
       }

       function createCardContent(tf, tfData, obj) {
         const ts = obj.ts || obj.time || obj.timestamp;
         const timestamp = fmtTs(ts);
         
         const statusBadges = [];
         if (tfData.isActive) statusBadges.push('<span class="status-badge status-active">활성</span>');
         if (tfData.isSelected) statusBadges.push('<span class="status-badge status-selected">선택</span>');
         if (tfData.canSell) statusBadges.push('<span class="status-badge status-can-sell">매도가능</span>');
         
         const zoneClass = tfData.zone === 'BLUE' ? 'zone-blue' : 'zone-orange';
         const priceChangeClass = (tfData.priceChange || 0) >= 0 ? 'positive' : 'negative';
         
         return `
           <div class="card-header">
             <div class="card-title">${tf}</div>
             <div class="card-status">${statusBadges.join('')}</div>
           </div>
           <div class="card-content">
             <div class="card-row">
               <span class="card-label">시간:</span>
               <span class="card-value">${timestamp}</span>
             </div>
             <div class="card-row">
               <span class="card-label">가격:</span>
               <span class="card-value">₩${(tfData.price || 0).toLocaleString()}</span>
             </div>
             <div class="card-row">
               <span class="card-label">변화:</span>
               <span class="card-value ${priceChangeClass}">${(tfData.priceChange || 0).toFixed(2)}%</span>
             </div>
             <div class="card-row">
               <span class="card-label">구역:</span>
               <span class="zone-badge ${zoneClass}">${tfData.zone || 'N/A'}</span>
             </div>
             <div class="card-row">
               <span class="card-label">강도:</span>
               <span class="card-value">${tfData.strength || 'N/A'}</span>
             </div>
             <div class="card-row">
               <span class="card-label">예상수익:</span>
               <span class="card-value ${(tfData.expectedReturn || 0) >= 0 ? 'positive' : 'negative'}">${(tfData.expectedReturn || 0).toFixed(2)}%</span>
             </div>
             <div class="card-row">
               <span class="card-label">액션:</span>
               <span class="card-value">${tfData.nextAction || 'N/A'}</span>
             </div>
             <div class="card-row">
               <span class="card-label">모드:</span>
               <span class="card-value">${tfData.mode === 'paper' ? '모의전' : tfData.mode === 'real' ? '실전' : 'N/A'}</span>
             </div>
             <div class="card-row">
               <span class="card-label">N/B 코인:</span>
               <span class="card-value">${tfData.nbCoins || 0}</span>
             </div>
             <div class="card-row">
               <span class="card-label">N/B 미네랄:</span>
               <span class="card-value">${(tfData.nbMinerals || 0).toFixed(2)}%</span>
             </div>
             <div class="card-row">
               <span class="card-label">매수 대기:</span>
               <span class="card-value">${tfData.buyWaitTime || 'N/A'}</span>
             </div>
             <div class="card-row">
               <span class="card-label">매도 대기:</span>
               <span class="card-value">${tfData.sellWaitTime || 'N/A'}</span>
             </div>
           </div>
         `;
       }

       function createLegacyCardContent(obj) {
         const ts = obj.ts || obj.time || obj.timestamp;
         const currentTf = obj.currentTimeframe || obj.tf || getColumn(obj,'selected.tf');
         const zone = getColumn(obj,'market.zone');
         const strength = getColumn(obj,'market.zoneStrength');
         const price = getColumn(obj,'market.currentPrice');
         const nextAction = getColumn(obj,'trade.nextAction');
         const mode = getColumn(obj,'trade.mode');
         const expected = getColumn(obj,'expected.expectedReturnPct');
         
         const zoneClass = zone === 'BLUE' ? 'zone-blue' : 'zone-orange';
         
         return `
           <div class="card-header">
             <div class="card-title">${currentTf || 'N/A'}</div>
             <div class="card-status"></div>
           </div>
           <div class="card-content">
             <div class="card-row">
               <span class="card-label">시간:</span>
               <span class="card-value">${fmtTs(ts)}</span>
             </div>
             <div class="card-row">
               <span class="card-label">가격:</span>
               <span class="card-value">${price || 'N/A'}</span>

             <div class="card-row">
               <span class="card-label">구역:</span>
               <span class="zone-badge ${zoneClass}">${zone || 'N/A'}</span>
             </div>
             <div class="card-row">
               <span class="card-label">강도:</span>
               <span class="card-value">${strength || 'N/A'}</span>

             <div class="card-row">
               <span class="card-label">예상수익:</span>
               <span class="card-value">${expected || 'N/A'}</span>

             <div class="card-row">
               <span class="card-label">액션:</span>
               <span class="card-value">${nextAction || 'N/A'}</span>
             </div>

               <span class="card-label">모드:</span>
               <span class="card-value">${mode || 'N/A'}</span>
             </div>
           </div>
         `;
       }

      function renderDetail(obj){
        const panel = $('#detail');
        $('#detail-ts').textContent = fmtTs(obj && (obj.ts || obj.time || obj.timestamp));
        $('#detail-tf').textContent = (obj && (obj.currentTimeframe || (obj.selected && obj.selected.tf))) || '';
        const container = $('#detail-tree');
        container.innerHTML = '';
        if (!obj){ container.textContent = '선택된 항목이 없습니다.'; return; }
        renderJsonTree(container, obj);
      }

      function renderJsonTree(rootEl, value, key){
        const el = document.createElement('div');
        el.className = 'tree';
        function node(k, v){
          const type = Object.prototype.toString.call(v); // [object Object]
          if (v === null){
            return `<div><span class=\"k\">${k}</span>: <span class=\"null\">null</span></div>`;
          }
          if (type === '[object Object]'){
            const keys = Object.keys(v);
            return `<details open><summary><span class=\"k\">${k}</span> { ${keys.length} }</summary>`
              + keys.map(ch=> node(ch, v[ch])).join('') + `</details>`;
          }
          if (type === '[object Array]'){
            return `<details open><summary><span class=\"k\">${k}</span> [${v.length}]</summary>`
              + v.map((item, idx)=> node('['+idx+']', item)).join('') + `</details>`;
          }
          if (typeof v === 'number'){
            return `<div><span class=\"k\">${k}</span>: <span class=\"num\">${v}</span></div>`;
          }
          if (typeof v === 'boolean'){
            return `<div><span class=\"k\">${k}</span>: <span class=\"bool\">${v}</span></div>`;
          }
          return `<div><span class=\"k\">${k}</span>: <span class=\"v\">${String(v)}</span></div>`;
        }
        el.innerHTML = node(key || 'root', value);
        rootEl.appendChild(el);
      }

      async function fetchLines(kind){
        const url = endpointMap[kind] || endpointMap.snapshot;
        console.log('🔍 API 호출:', url);
        
        try {
          const res = await fetch(url, { cache: 'no-store' });
          console.log('📡 응답 상태:', res.status, res.statusText);
          
          if (!res.ok) {
            console.error('❌ API 응답 오류:', res.status, res.statusText);
            throw new Error(`HTTP ${res.status}: ${res.statusText}`);
          }
          
          const data = await res.json().catch((err) => {
            console.error('❌ JSON 파싱 오류:', err);
            return {};
          });
          
          console.log('📊 받은 데이터:', data);
          
          // 허용하는 형태:
          // 1) { lines: string[] | object[] }
          // 2) string[]
          // 3) { content: string }  // JSONL 원문
          if (Array.isArray(data)) {
            console.log('✅ 배열 형태 데이터:', data.length, '개 항목');
            return data;
          }
          if (data && Array.isArray(data.lines)) {
            console.log('✅ lines 배열 데이터:', data.lines.length, '개 항목');
            return data.lines;
          }
          if (typeof data.content === 'string') {
            console.log('✅ content 문자열 데이터');
            return data.content.split('\n').filter(Boolean);
          }
          
          // 서버 구현이 다를 경우, 그냥 data를 한 줄로 표시
          console.log('⚠️ 알 수 없는 데이터 형태, 단일 항목으로 처리');
          return [data];
        } catch (error) {
          console.error('❌ fetchLines 오류:', error);
          throw error;
        }
      }

      async function load(){
        const kind = $('#source').value;
        console.log('🔄 데이터 로드 시작:', kind);
        $('#status').textContent = '불러오는 중...';
        
        try{
          const lines = await fetchLines(kind);
          console.log('📋 파싱된 라인 수:', lines.length);
          
          if (lines.length === 0) {
            console.log('⚠️ 데이터가 없습니다');
            $('#status').textContent = '데이터 없음';
            renderRows([]);
          } else {
            renderRows(lines);
            $('#status').textContent = `완료 (${lines.length}개 항목)`;
          }
        }catch(err){
          console.error('❌ 로드 오류:', err);
          $('#status').textContent = '오류: ' + (err && err.message ? err.message : 'unknown');
          renderRows([]);
        }
        
        $('#updatedAt').textContent = new Date().toLocaleString();
        
        // 첫 항목 상세 자동 표시
        const first = $('#log-body tr');
        if (first){
          try{
            const obj = safeParse(lastLinesCache[0]);
            if (obj) { 
              first.classList.add('active'); 
              renderDetail(obj); 
              console.log('✅ 첫 항목 상세 표시 완료');
            }
          }catch(err){ 
            console.error('❌ 첫 항목 상세 표시 실패:', err);
          }
        }
      }

      function startAuto(){
        stopAuto();
        const sec = Math.max(2, Math.min(60, Number($('#intervalSec').value) || 5));
        $('#intervalSec').value = String(sec);
        timer = setInterval(load, sec * 1000);
      }

      function stopAuto(){ if (timer){ clearInterval(timer); timer = null; } }

      function toggleAuto(){
        const on = $('#autoRefresh').checked;
        if (on) startAuto(); else stopAuto();
      }

             function init(){
         console.log('🚀 Snapshot Viewer 초기화 시작');
         console.log('🔗 현재 URL:', window.location.href);
         console.log('🌐 Origin:', window.location.origin);
         console.log('📡 API 엔드포인트:', endpointMap);
         
         // controls
         $('#refreshBtn').addEventListener('click', load);
         
         // 뷰 토글 버튼
         $('#tableViewBtn').addEventListener('click', () => switchView('table'));
         $('#cardViewBtn').addEventListener('click', () => switchView('card'));
         
         // N/B 코인 초기화 버튼
         $('#resetNbCoinsBtn').addEventListener('click', resetNbCoins);
        $('#autoRefresh').addEventListener('change', toggleAuto);
        $('#intervalSec').addEventListener('change', ()=>{ if ($('#autoRefresh').checked) startAuto(); });
        $('#tfFilter').addEventListener('change', load);
        $('#textFilter').addEventListener('input', ()=>{ // 필터는 즉시 반영
          // 이미 로드된 행에서 필터만 재적용하려면, 마지막 데이터 보관이 필요.
          // 단순화를 위해 재조회.
          load();
        });
        $('#latestOnly').addEventListener('change', ()=>{ // 최신만 체크박스 변경 시 즉시 반영
          load();
        });
        $('#dataTypeFilter').addEventListener('change', load);
        $('#source').addEventListener('change', load);
        const copyBtn = $('#copyJson');
        if (copyBtn){
          copyBtn.addEventListener('click', ()=>{
            try{
              const active = document.querySelector('#log-body tr.active');
              if (!active) return;
              const idx = Array.from(active.parentElement.children).indexOf(active);
              const obj = safeParse(lastLinesCache[idx]);
              if (obj) navigator.clipboard.writeText(JSON.stringify(obj, null, 2));
            }catch(_){ }
          });
        }

                 // 첫 로드
         console.log('🔄 첫 데이터 로드 시작');
         load();
       }

       function switchView(view) {
         currentView = view;
         
         // 버튼 상태 업데이트
         $('#tableViewBtn').classList.toggle('active', view === 'table');
         $('#cardViewBtn').classList.toggle('active', view === 'card');
         
         // 뷰 표시/숨김
         $('#tableView').classList.toggle('active', view === 'table');
         $('#cardView').classList.toggle('active', view === 'card');
         
         // 카드 뷰인 경우 카드 렌더링
         if (view === 'card' && lastLinesCache.length > 0) {
           renderCards(lastLinesCache);
         }
       }

       // N/B 코인 초기화 함수
       async function resetNbCoins() {
         if (!confirm('모든 타임프레임의 N/B 코인을 0으로 초기화하시겠습니까?')) {
           return;
         }

         try {
           // 카드 스토리지 시스템이 있는지 확인
           if (window.cardStorageSystem) {
             // 모든 타임프레임의 N/B 코인을 0으로 설정
             const timeframes = ['1m', '3m', '5m', '10m', '15m', '30m', '1h', '1D'];
             
             timeframes.forEach(tf => {
               const storage = window.cardStorageSystem.getCardStorage(tf);
               if (storage) {
                 storage.nbCoins = 0;
                 storage.nbMinerals = 0;
               }
             });
             
             // 변경사항 저장
             window.cardStorageSystem.saveCardStorages();
             
             alert('N/B 코인이 초기화되었습니다!');
             
             // 페이지 새로고침으로 변경사항 반영
             setTimeout(() => {
               window.location.reload();
             }, 1000);
             
           } else {
             // 카드 스토리지 시스템이 없는 경우 localStorage 직접 수정
             const cardStorageData = localStorage.getItem('cardStorageData');
             if (cardStorageData) {
               const data = JSON.parse(cardStorageData);
               const timeframes = ['1m', '3m', '5m', '10m', '15m', '30m', '1h', '1D'];
               
               timeframes.forEach(tf => {
                 if (data[tf]) {
                   data[tf].nbCoins = 0;
                   data[tf].nbMinerals = 0;
                 }
               });
               
               localStorage.setItem('cardStorageData', JSON.stringify(data));
               alert('N/B 코인이 초기화되었습니다!');
               
               setTimeout(() => {
                 window.location.reload();
               }, 1000);
             } else {
               alert('카드 스토리지 데이터를 찾을 수 없습니다.');
             }
           }
           
         } catch (error) {
           console.error('N/B 코인 초기화 실패:', error);
           alert('초기화 중 오류가 발생했습니다: ' + error.message);
         }
       }

      window.addEventListener('DOMContentLoaded', init);
    })();
  </script>
