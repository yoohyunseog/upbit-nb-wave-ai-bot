<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Loader Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>Template Loader Test</h1>
    <div id="test-results"></div>
    
    <script src="modules/templates/game-system.js"></script>
    <script src="modules/templates/template-loader.js"></script>
    <script>
        const resultsDiv = document.getElementById('test-results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }
        
        async function runTests() {
            addResult('Starting template loader tests...', 'info');
            
            // Test 1: Check if template loader is available
            if (window.templateLoader) {
                addResult('✅ Template Loader is available!', 'success');
                console.log('Template Loader:', window.templateLoader);
            } else {
                addResult('❌ Template Loader is NOT available!', 'error');
                return;
            }
            
            // Test 2: Check if methods are available
            if (typeof window.templateLoader.loadTemplate === 'function') {
                addResult('✅ loadTemplate method is available', 'success');
            } else {
                addResult('❌ loadTemplate method is missing', 'error');
            }
            
            if (typeof window.templateLoader.loadActiveSignalsTemplate === 'function') {
                addResult('✅ loadActiveSignalsTemplate method is available', 'success');
            } else {
                addResult('❌ loadActiveSignalsTemplate method is missing', 'error');
            }
            
            if (typeof window.templateLoader.bindTemplate === 'function') {
                addResult('✅ bindTemplate method is available', 'success');
            } else {
                addResult('❌ bindTemplate method is missing', 'error');
            }
            
            // Test 3: Try to load the active signals template
            try {
                addResult('🔄 Attempting to load active signals template...', 'info');
                const template = await window.templateLoader.loadActiveSignalsTemplate();
                
                if (template && template.length > 0) {
                    addResult('✅ Active signals template loaded successfully!', 'success');
                    console.log('Template content:', template.substring(0, 200) + '...');
                } else {
                    addResult('❌ Active signals template is empty', 'error');
                }
            } catch (error) {
                addResult(`❌ Failed to load template: ${error.message}`, 'error');
                console.error('Template loading error:', error);
            }
            
            // Test 4: Test template binding
            try {
                addResult('🔄 Testing template binding...', 'info');
                const testData = {
                    signals: [
                        { type: 'blue', strength: 0.8, timeframe: '1h' },
                        { type: 'orange', strength: 0.6, timeframe: '4h' }
                    ]
                };
                
                const template = await window.templateLoader.loadActiveSignalsTemplate();
                const boundTemplate = window.templateLoader.bindTemplate(template, testData);
                
                if (boundTemplate && boundTemplate.includes('blue') && boundTemplate.includes('orange')) {
                    addResult('✅ Template binding works correctly!', 'success');
                } else {
                    addResult('❌ Template binding failed', 'error');
                }
            } catch (error) {
                addResult(`❌ Template binding error: ${error.message}`, 'error');
            }
            
            addResult('🎉 All tests completed!', 'info');
        }
        
        // Run tests after a short delay to ensure everything is loaded
        setTimeout(runTests, 1000);
    </script>
</body>
</html>
