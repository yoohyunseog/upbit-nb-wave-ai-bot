<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>8BIT Upbit Bot UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tab Menu CSS (inlined) -->
  <style>
        /* Custom CSS */
        body {
            background: #0b1220;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: #1e2329;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .container-fluid {
            padding: 20px;
        }
        /* 탭 시스템 스타일 */
        .tabs {
            list-style: none;
            padding: 0;
            margin: 0;
      display: flex;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            background: #1e2329;
        }
        
        .tabs li {
            margin: 0;
        }
        
        .tabs a {
            display: block;
            padding: 12px 20px;
      color: #888888;
            text-decoration: none;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
      font-weight: 600;
      font-size: 14px;
        }
        
        .tabs a:hover {
      color: #ffffff;
            background: rgba(255,255,255,0.05);
        }
        
        .tabs a.active {
            color: #00d1ff;
            border-bottom-color: #00d1ff;
            background: rgba(0,209,255,0.1);
        }
        
        .tab-content {
            display: none;
            padding: 20px;
            background: #0b1220;
        }
        
        .tab-content.active {
            display: block;
    }
  </style>
</head>
<body>
    <div class="container-fluid">
        <!-- 탭 시스템 -->
        <ul class="tabs">
            <li><a href="#tab1">🃏 Guild Members Card System</a></li>
            <li><a href="#tab2" class="active">📊 Trading Dashboard</a></li>
        </ul>
        
        <!-- 탭 1: Guild Members Card System -->
        <div id="tab1" class="tab-content">
            <div class="row">
                <div class="col-12">
                    <div class="card border-secondary rounded-3 p-3">
                        <h4 class="text-white mb-0">🃏 Guild Members Card System</h4>
                        <p class="text-muted">AI 길드원들의 카드 기반 자동 거래 시스템 - N/B 길드 엔진</p>
                        <div class="text-center">
                            <canvas id="gameCanvas" width="800" height="600" style="border: 1px solid #333; background: #0a0a0a; border-radius: 8px; margin: 10px auto; display: block;"></canvas>
                            <div id="gameControls" style="margin-top: 10px;">
                                <button id="toggleNBGuild" class="btn btn-sm btn-outline-primary">N/B 길드 토글</button>
                                <button id="toggleBitcoin" class="btn btn-sm btn-outline-warning">비트코인 토글</button>
                                <button id="toggleMovingVillage" class="btn btn-sm btn-outline-success">이동 마을 토글</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

        <!-- 탭 2: Trading Dashboard -->
        <div id="tab2" class="tab-content active">
            <div id="trading-dashboard-content">
                <div class="text-center">
                    <p>Loading Trading Dashboard...</p>
                </div>
              </div>
            </div>
    </div>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Tab Menu JS (inlined) -->
    <script>
        // 탭 전환 기능
        $(document).ready(function() {
            $('.tabs a').click(function(e) {
                e.preventDefault();
                
                // 모든 탭 비활성화
                $('.tabs a').removeClass('active');
                $('.tab-content').removeClass('active');
                
                // 클릭된 탭 활성화
                $(this).addClass('active');
                const targetId = $(this).attr('href').substring(1);
                $('#' + targetId).addClass('active');
                
                // 탭 2 (Trading Dashboard)가 활성화되면 파일 로드
                if (targetId === 'tab2') {
                    loadTradingDashboard();
                }
                
                // 탭 1 (Guild Members Card System)이 활성화되면 게임 시스템 로드
                if (targetId === 'tab1') {
                    loadGameSystem();
                }
            });
            
            // Trading Dashboard 파일 로드 함수
            function loadTradingDashboard() {
                // 이미 로드되었는지 확인
                if (window.tradingDashboardLoaded) return;
                
                $('#trading-dashboard-content').html('<div class="text-center"><p>Loading Trading Dashboard...</p></div>');
                
                // trading-dashboard.html 파일 로드
                $.get('/static/trading-dashboard.html', function(data) {
                    $('#trading-dashboard-content').html(data);
                    
                    // 필요한 스크립트들 동적 로드
                    const scripts = [
                        'https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js',
                        'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js',
                        'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
                        'https://unpkg.com/masonry-layout@4.2.2/dist/masonry.pkgd.min.js',
                        '/static/mayor-guidance.js?v=dev',
                        '/static/village-trading-process.js?v=dev',
                        '/static/trainer-system.js?v=dev',
                        '/static/village-learning-system.js?v=dev',
                        '/static/guild-members-status.js?v=dev',
                        '/static/ui.js?v=dev'
                    ];
                    
                    let loadedScripts = 0;
                    const totalScripts = scripts.length;
                    
                    // LightweightCharts를 먼저 로드하고 나머지는 순차적으로 로드
                    function loadScriptSequentially(scriptList, index = 0) {
                        if (index >= scriptList.length) {
                            // 모든 스크립트 로드 완료
                                                                setTimeout(function() {
                                        if (typeof initChart === 'function') {
                                            initChart();
                                        }
                                        console.log('📊 Trading Dashboard initialized successfully');
                                        
                                        // Auto-enable toggles after chart initialization
                                        setTimeout(function() {
                                            if (typeof window.enableAutoToggles === 'function') {
                                                window.enableAutoToggles();
                                            }
                                        }, 3000);
                                    }, 1000); // 더 긴 대기 시간
                            return;
                        }
                        
                        const src = scriptList[index];
                        if (!document.querySelector(`script[src="${src}"]`)) {
                            const script = document.createElement('script');
                            script.src = src;
                            script.onload = function() {
                                console.log(`✅ Loaded: ${src}`);
                                // 다음 스크립트 로드
                                setTimeout(() => loadScriptSequentially(scriptList, index + 1), 100);
                            };
                            script.onerror = function() {
                                console.error(`❌ Failed to load: ${src}`);
                                // 에러가 있어도 다음 스크립트 로드
                                setTimeout(() => loadScriptSequentially(scriptList, index + 1), 100);
                            };
                            document.head.appendChild(script);
                        } else {
                            console.log(`✅ Already loaded: ${src}`);
                            // 이미 로드된 경우 다음 스크립트로
                            setTimeout(() => loadScriptSequentially(scriptList, index + 1), 100);
                        }
                    }
                    
                    // 순차적으로 스크립트 로드
                    loadScriptSequentially(scripts);
                    
                    window.tradingDashboardLoaded = true;
                }).fail(function() {
                    $('#trading-dashboard-content').html('<div class="text-center text-danger"><p>Failed to load Trading Dashboard</p></div>');
                });
            }
            
            // Guild Members Card System 로드 함수
            function loadGameSystem() {
                if (!window.gameSystemLoaded) {
                    $.getScript('/static/guild-members-card-system.js', function() {
                        window.gameSystemLoaded = true;
                        console.log('🃏 Guild Members Card System loaded successfully');
                        
                        // 게임 시스템 초기화
                        if (window.initGameSystem) {
                            window.initGameSystem();
                        }
                    }).fail(function() {
                        console.error('Failed to load Guild Members Card System');
                    });
                }
            }
            
            // 초기 로드 시 활성화된 탭에 따라 시스템 로드
            if ($('#tab1').hasClass('active')) {
                loadGameSystem();
            } else if ($('#tab2').hasClass('active')) {
                loadTradingDashboard();
            }
        });
    </script>
</body>
</html>
